<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Замовлення</title>
<style>
:root{color-scheme:light dark;--fg:#37352f;--muted:#787774;--line:#e3e2e0;--btn:#2383c4;--btn-fg:#fff;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#e6e6e4;--muted:#9b9a97;--line:#3a3a3a;--bg:#191919}}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#w{padding:10px 2px;display:grid;gap:10px}
.row{display:grid;gap:10px}
.f{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:8px}
label,.l{font-size:13px;color:var(--muted)}
select,.q button,.q output{height:44px;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line)}
option{color:var(--fg);background:var(--bg)}
select{width:100%;border-radius:8px;padding:0 8px}
.q{display:flex}
.q button{width:44px;cursor:pointer;font-size:20px}
.q button:first-child{border-radius:8px 0 0 8px}
.q button:last-child{border-radius:0 8px 8px 0}
.q output{flex:1;min-width:44px;display:grid;place-items:center;border-width:1px 0}
.one{height:44px;display:flex;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:8px}
.b{display:block;width:100%;border:0;font:inherit;cursor:pointer;text-align:center;text-decoration:none;color:#fff;border-radius:8px;padding:12px;font-weight:600}
#go{background:var(--btn)}
#ig{background:#c13584;font-weight:600}
#sum{display:grid;gap:4px;font-size:14px}
.s{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.s .l{margin-right:auto}
.s s{color:var(--muted);font-size:13px}
.s b{font-weight:600}
.s i{font-style:normal;font-weight:600;color:#c13584}
.bf{font-size:12px;font-weight:600;letter-spacing:.02em;color:#c13584}
#err{color:var(--muted)}
#note{font-size:13px;color:var(--muted)}
/* Notion paints #191919 behind embeds; cards open in a #202020 popup, so match the popup */
@media (prefers-color-scheme:dark){html,body{background:#202020}}
html:has(body.page),body.page{background:var(--bg)}
body.page{min-height:100vh;display:grid;place-items:center;padding:16px}
body.page #w{width:100%;max-width:480px;padding:0}
#manual{display:block;width:100%;margin-top:4px;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px}
#gal{display:grid;gap:8px}
#pw{height:170px;background:#fff;border-radius:8px;display:grid;place-items:center;overflow:hidden}
#ph{display:block;height:170px;width:100%;object-fit:contain}
#ph[hidden],#nop[hidden]{display:none}
#nop{display:grid;justify-items:center;gap:10px;color:#787774;font-size:13px}
#dot{width:72px;height:72px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;overflow:hidden;display:grid;place-items:center}
.sw button[aria-checked=true]{outline:2px solid var(--btn);outline-offset:1px}
.sw img{width:40px;height:40px;object-fit:contain}
.sw i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#cn{font-size:14px}
</style>
</head>
<body>
<div id="w"></div>
<script src="products.js"></script>
<script>
var q = new URLSearchParams(location.search);
var IG = 'https://ig.me/m/no.waves.ua';
var money = function (x) { return String(x).replace(/\B(?=(\d{3})+$)/g, ' '); };
// Black Friday: 12.11 00:00 – 30.11 23:59 Kyiv (UTC+2). p.b = {size: [master, sale]} replaces the November promo in that window.
var BF = Date.now() >= Date.UTC(2026, 10, 11, 22) && Date.now() < Date.UTC(2026, 10, 30, 22);
var key = function (o, size) { return o && (o[size] ? size : o['1 шт'] ? '1 шт' : size ? null : Object.keys(o)[0]); };
var isBF = function (size) { var k = key(p.p, size); return !!(BF && p.b && k && p.b[k]); };
var priceOf = function (size) {
  var k = key(p.p, size); if (!k) return null;
  var x = p.p[k]; return isBF(size) ? [x[0], x[1], p.b[k][0], p.b[k][1]] : x;
};
// [label, regular total, total to pay, percent or 0] for master and sale prices
var sums = function (size, qty) {
  var pr = priceOf(size), out = [];
  if (pr) [['Для майстра', pr[0], pr[2]], ['Для продажу', pr[1], pr[3]]].forEach(function (x) {
    if (!x[1]) return;
    var sale = x[2] && x[2] < x[1];
    out.push([x[0], x[1] * qty, (sale ? x[2] : x[1]) * qty, sale ? Math.round((1 - x[2] / x[1]) * 100) : 0]);
  });
  return out;
};
// colour: one entry of p.k = [name, article, has photo, swatch colour]
var orderText = function (size, qty, colour) {
  return 'Хочу замовити: ' + p.n + '\nАртикул: ' + (colour ? colour[1] : p.a) + '\n' + (colour ? 'Колір: ' + colour[0].toLowerCase() + '\n' : '') +
    (size ? (p.l || 'Обʼєм') + ': ' + size + '\n' : '') + 'Кількість: ' + qty +
    sums(size, qty).slice(0, 1).map(function (x) { return '\nСума ' + x[0].toLowerCase() + ': ' + money(x[2]) + ' грн' + (x[3] ? ' (' + (isBF(size) ? 'Чорна пʼятниця' : 'акція') + ' −' + x[3] + '%)' : ''); }).join('');
};
// Instagram has no prefilled text. The embed cannot reach the clipboard, so this step runs in its own tab.
function igPage() {
  document.body.className = 'page';
  var size = q.get('s');
  var text = orderText(size, +q.get('q') || 1, p.k && p.k[+q.get('k') || 0]);
  w.innerHTML = '<div class="l">Скопіюйте текст замовлення й вставте його в чат Instagram</div>' +
    '<textarea id="manual" readonly rows="9"></textarea>' +
    '<button type="button" id="ig" class="b">Скопіювати й відкрити Instagram</button><div id="note"></div>';
  document.getElementById('manual').value = text;
  document.getElementById('ig').onclick = function () {
    var m = document.getElementById('manual'), go = function () { document.getElementById('note').textContent = 'Текст скопійовано'; location.href = IG; };
    var old = function () { m.focus(); m.select(); m.setSelectionRange(0, text.length); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} if (ok) go(); else document.getElementById('note').textContent = 'Не вдалося скопіювати: виділіть текст вручну, а потім відкрийте Instagram'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(go, old); else old();
  };
}
var p = window.PRODUCTS && PRODUCTS[q.get('p')];
var w = document.getElementById('w');
if (!p) {
  w.innerHTML = '<div id="err">Товар не знайдено. Напишіть нам у Telegram: @no_waves_ua</div>';
} else {
  var o = p.o || [], name = p.l || 'Обʼєм', pick;
  if (q.get('ig')) igPage(); else {
  if (o.length > 1) pick = '<select id="v">' + o.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select>';
  else if (o.length === 1) pick = '<div class="one">' + o[0] + '</div>';
  var ks = p.k || [], col = 0;
  w.innerHTML =
    (ks.length ? '<div id="gal"><div id="pw"><img id="ph" alt=""><div id="nop"><i id="dot"></i>Фото цього кольору поки немає</div></div><div class="f"><span class="l">Колір</span><span id="cn"></span></div>' +
      '<div class="sw" role="radiogroup" aria-label="Колір">' + ks.map(function (x, i) {
        return '<button type="button" role="radio" data-i="' + i + '" title="' + x[0] + '" aria-label="' + x[0] + '">' +
          (x[2] ? '<img src="img/' + x[1] + '.webp" alt="">' : '<i style="background:' + x[3] + '"></i>') + '</button>';
      }).join('') + '</div></div>' : '') +
    '<div class="row">' +
      (pick ? '<div class="f"><span class="l">' + name + '</span>' + pick + '</div>' : '') +
      '<div class="f"><span class="l">Кількість</span><div class="q">' +
        '<button type="button" id="m" aria-label="Менше">−</button><output id="c">1</output>' +
        '<button type="button" id="a" aria-label="Більше">+</button></div></div>' +
    '</div>' +
    '<div id="sum"></div>' +
    '<a id="go" class="b" target="_blank" rel="noopener">Замовити в Telegram</a>' +
    '<a id="ig" class="b" target="_blank" rel="noopener" >Замовити в Instagram</a>';
  var qty = 1, text = '', v = document.getElementById('v'), failed = false;
  var line = function (x) {
    return '<div class="s"><span class="l">' + x[0] + '</span>' +
      (x[3] ? '<s>' + money(x[1]) + '</s>' : '') + '<b>' + money(x[2]) + ' грн</b>' +
      (x[3] ? '<i>−' + x[3] + '%</i>' : '') + '</div>';
  };
  var render = function () {
    var size = v ? v.value : o[0];
    document.getElementById('c').textContent = qty;
    if (ks.length) {
      var ph = document.getElementById('ph');
      var dot = document.getElementById('dot');
      ph.hidden = !ks[col][2]; document.getElementById('nop').hidden = !!ks[col][2]; dot.style.background = ks[col][3];
      if (ks[col][2]) { ph.src = 'img/' + ks[col][1] + '.webp'; ph.alt = ks[col][0]; }
      document.getElementById('cn').textContent = ks[col][0];
      [].forEach.call(document.querySelectorAll('.sw button'), function (b) { b.setAttribute('aria-checked', +b.dataset.i === col); });
    }
    text = orderText(size, qty, ks[col]);
    document.getElementById('sum').innerHTML = (isBF(size) ? '<div class="bf">Чорна пʼятниця · до 30 листопада</div>' : '') + sums(size, qty).map(line).join('');
    document.getElementById('go').href = 'https://t.me/no_waves_ua?text=' + encodeURIComponent(text);
    document.getElementById('ig').href = '?p=' + q.get('p') + '&ig=1&s=' + encodeURIComponent(size || '') + '&q=' + qty + (ks.length ? '&k=' + col : '');
  };
  if (v) v.onchange = render;
  [].forEach.call(document.querySelectorAll('.sw button'), function (b) { b.onclick = function () { col = +b.dataset.i; render(); }; });
  document.getElementById('m').onclick = function () { if (qty > 1) { qty--; render(); } };
  document.getElementById('a').onclick = function () { if (qty < 99) { qty++; render(); } };
  render();
  }
}
</script>
</body>
</html>
