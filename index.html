<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Замовлення</title>
<style>
:root{color-scheme:light dark;--fg:#37352f;--muted:#787774;--line:#e3e2e0;--btn:#2383c4;--btn-fg:#fff;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#e6e6e4;--muted:#9b9a97;--line:#3a3a3a;--bg:#191919}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#w{padding:10px 2px;display:grid;gap:10px}
.row{display:grid;gap:10px}
.f{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:8px}
label,.l{font-size:13px;color:var(--muted)}
select,.q button,.q output{height:44px;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line)}
select{width:100%;border-radius:8px;padding:0 8px}
.q{display:flex}
.q button{width:44px;cursor:pointer;font-size:20px}
.q button:first-child{border-radius:8px 0 0 8px}
.q button:last-child{border-radius:0 8px 8px 0}
.q output{flex:1;min-width:44px;display:grid;place-items:center;border-width:1px 0}
.one{height:44px;display:flex;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:8px}
.b{display:block;width:100%;border:0;font:inherit;cursor:pointer;text-align:center;text-decoration:none;color:#fff;border-radius:8px;padding:12px;font-weight:600}
#go{background:var(--btn)}
#ig{background:#c13584;font-weight:600}
#err{color:var(--muted)}
#note{font-size:13px;color:var(--muted)}
#manual{display:block;width:100%;margin-top:4px;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px}
</style>
</head>
<body>
<div id="w"></div>
<script src="products.js"></script>
<script>
var q = new URLSearchParams(location.search);
var IG = 'https://ig.me/m/no.waves.ua';
// Instagram has no prefilled text. The embed cannot reach the clipboard, so this step runs in its own tab.
function igPage() {
  var size = q.get('s');
  var text = 'Хочу замовити: ' + p.n + '\nАртикул: ' + p.a + '\n' + (size ? (p.l || 'Обʼєм') + ': ' + size + '\n' : '') + 'Кількість: ' + q.get('q');
  w.innerHTML = '<div class="l">Скопіюйте текст заказу й вставте його в чат Instagram</div>' +
    '<textarea id="manual" readonly rows="5"></textarea>' +
    '<button type="button" id="ig" class="b">Скопіювати й відкрити Instagram</button><div id="note"></div>';
  document.getElementById('manual').value = text;
  document.getElementById('ig').onclick = function () {
    var m = document.getElementById('manual'), go = function () { document.getElementById('note').textContent = 'Текст скопійовано. Зараз відкриється Instagram: вставте текст у чат і надішліть.'; setTimeout(function () { location.href = IG; }, 3000); };
    var old = function () { m.focus(); m.select(); m.setSelectionRange(0, text.length); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} if (ok) go(); else document.getElementById('note').textContent = 'Не вдалося скопіювати: виділіть текст вручну, а потім відкрийте Instagram'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(go, old); else old();
  };
}
var p = window.PRODUCTS && PRODUCTS[q.get('p')];
var w = document.getElementById('w');
if (!p) {
  w.innerHTML = '<div id="err">Товар не знайдено. Напишіть нам у Telegram: @no_waves_ua</div>';
} else {
  var o = p.o || [], name = p.l || 'Обʼєм', pick;
  if (q.get('ig')) igPage(); else {
  if (o.length > 1) pick = '<select id="v">' + o.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select>';
  else if (o.length === 1) pick = '<div class="one">' + o[0] + '</div>';
  w.innerHTML =
    '<div class="row">' +
      (pick ? '<div class="f"><span class="l">' + name + '</span>' + pick + '</div>' : '') +
      '<div class="f"><span class="l">Кількість</span><div class="q">' +
        '<button type="button" id="m" aria-label="Менше">−</button><output id="c">1</output>' +
        '<button type="button" id="a" aria-label="Більше">+</button></div></div>' +
    '</div>' +
    '<a id="go" class="b" target="_blank" rel="noopener">Замовити в Telegram</a>' +
    '<a id="ig" class="b" target="_blank" rel="noopener" >Замовити в Instagram</a>';
  var qty = 1, text = '', v = document.getElementById('v'), failed = false;
  var render = function () {
    var size = v ? v.value : o[0];
    document.getElementById('c').textContent = qty;
    text = 'Хочу замовити: ' + p.n + '\nАртикул: ' + p.a + '\n' + (size ? name + ': ' + size + '\n' : '') + 'Кількість: ' + qty;
    document.getElementById('go').href = 'https://t.me/no_waves_ua?text=' + encodeURIComponent(text);
    document.getElementById('ig').href = '?p=' + q.get('p') + '&ig=1&s=' + encodeURIComponent(size || '') + '&q=' + qty;
  };
  if (v) v.onchange = render;
  document.getElementById('m').onclick = function () { if (qty > 1) { qty--; render(); } };
  document.getElementById('a').onclick = function () { if (qty < 99) { qty++; render(); } };
  render();
  }
}
</script>
</body>
</html>
